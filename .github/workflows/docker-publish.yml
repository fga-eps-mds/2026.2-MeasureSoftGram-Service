name: Publish Docker Image

# Builda a imagem do Service no CI cloud (ubuntu-latest) e publica no
# DockerHub somente apos a suite de testes (Rodar Testes) passar com sucesso.
# A box de producao so faz PULL (deploy-prod.yml), nunca build.
on:
  workflow_run:
    workflows: ["Rodar Testes"]
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Login no DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da imagem
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # latest pra deploy simples + sha pra rollback/deploy deterministico.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/service:${{ github.event.workflow_run.head_sha || github.sha }}
